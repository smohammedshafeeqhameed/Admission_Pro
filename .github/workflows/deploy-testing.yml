
name: Deploy Admission Pro Testing

on:
  push:
    branches:
      - stage

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admission-pro-testing-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Testing EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stage branch
        uses: actions/checkout@v4

      - name: Deploy to Testing EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.TEST_EC2_HOST }}
          username: ${{ secrets.TEST_EC2_USER }}
          key: ${{ secrets.TEST_EC2_SSH_KEY }}
          port: 22
          command_timeout: 20m

          script: |
            set -Eeuo pipefail

            echo "=================================="
            echo "Admission Pro Testing Deployment"
            echo "=================================="

            cd /home/ubuntu/Admission_Pro

            echo "Checking deployment branch..."
            git fetch origin stage
            git checkout stage
            git reset --hard origin/stage

            echo "Activating Python virtual environment..."
            source venv/bin/activate

            echo "Installing Python requirements..."
            pip install -r requirements.txt

            echo "Checking Django configuration..."
            python manage.py check

            echo "Checking database migration plan..."
            python manage.py migrate --plan

            echo "Applying migrations to TESTING database..."
            python manage.py migrate --noinput

            echo "Collecting static files..."
            python manage.py collectstatic --noinput

            echo "Restarting testing Gunicorn service..."
            sudo systemctl restart admission-pro-testing

            echo "Checking Gunicorn service..."
            sudo systemctl is-active --quiet admission-pro-testing

            echo "Checking application response..."
            curl --fail --silent --show-error \
              http://127.0.0.1:8000/ \
              -o /dev/null

            echo "=================================="
            echo "Testing deployment successful!"
            echo "https://test.campusentrykerala.in"
            echo "=================================="
